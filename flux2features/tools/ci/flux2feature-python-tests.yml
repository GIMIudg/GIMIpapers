# GitHub Actions workflow for the Python tool. GitHub only runs workflows from
# the root of a repository: copy this file to GIMIpapers/.github/workflows/.
name: flux2feature (Python)

on:
  push:
    paths: ["flux2features/tools/python/**"]
  pull_request:
    paths: ["flux2features/tools/python/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    defaults:
      run:
        working-directory: flux2features/tools/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test,frame]"
      - run: python -m pytest -q
      - run: python examples/quickstart.py
      - run: python examples/rbc_gem_reference.py
